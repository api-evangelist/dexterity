openapi: 3.2.0
info:
  title: Dexterity Foresight Packing Challenge Leaderboard API
  version: 0.1.0
  description: The Foresight Packing Challenge API is a public REST API published by Dexterity that exposes a subset of the Foresight world model as a sequential 3D bin-packing problem.
  contact:
    name: Dexterity
    url: https://dexterity.ai/contact
    email: contact@dexterity.ai
  termsOfService: https://dexterity.ai/terms-conditions
servers:
- url: https://dexterity.ai/challenge/api
  description: Foresight Packing Challenge production endpoint
tags:
- name: Leaderboard
  description: Retrieve the public Foresight Packing Challenge leaderboard.
paths:
  /leaderboard:
    get:
      summary: Get Leaderboard
      operationId: get_leaderboard_leaderboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Leaderboard
externalDocs:
  description: Foresight API Challenge
  url: https://dexterity.ai/challenge
